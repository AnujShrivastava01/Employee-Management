spring:
  application:
    name: employee-management
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ems}
    username: ${DB_USERNAME:ems}
    password: ${DB_PASSWORD:ems_password}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 10000
      initialization-fail-timeout: 60000 # keep retrying while the database container boots
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # the schema is owned by Flyway
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    connect-retries: 20
    connect-retries-interval: 3s
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  mvc:
    problemdetails:
      enabled: false

server:
  port: ${PORT:8080}
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%X{requestId:-}] %logger{36} - %msg%n"
  level:
    root: INFO
    com.example.employeemanagement: INFO

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  security:
    admin-username: ${ADMIN_USERNAME:admin}
    # Leave empty to generate a random password that is printed once in the log.
    admin-password: ${ADMIN_PASSWORD:}
    secure-cookies: ${SESSION_COOKIE_SECURE:false}
  seed:
    enabled: ${SEED_DEMO_DATA:false}
  export:
    batch-size: 500
